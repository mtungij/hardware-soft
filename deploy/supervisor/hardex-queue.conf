[program:hardex-queue]
directory=/var/www/hardex
command=/usr/bin/php -d memory_limit=512M /var/www/hardex/artisan queue:work --queue=whatsapp,default --sleep=3 --tries=3 --timeout=90 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/hardex/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:hardex-scheduler]
directory=/var/www/hardex
command=/usr/bin/php /var/www/hardex/artisan schedule:work
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/hardex/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
